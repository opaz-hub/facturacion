<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INNOVANET Facturación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: navy sidebar + workspace. Documents (cotización, proforma, factura) are the unit of work;
   cobros, CAI and recurrentes hang off them. Navy and blue follow the existing INNOVANET system, orange comes from its logo. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f5f7fb; --ink:#0f1b33; --muted:#5b6882; --line:#dde3ee;
  --nav:#0f1b33; --nav-ink:#b9c5e0; --nav-hi:#ffffff; --nav-active:#1f3a7d; --nav-line:#22314f;
  --accent:#2a5bd7; --accent-ink:#ffffff; --accent-soft:#e6edfc; --accent-line:#bdd0f6;
  --warm:#e8831a; --warm-soft:#fdf0e1;
  --ok:#14774a; --ok-soft:#e0f4ea; --warn:#8f5600; --warn-soft:#fdefd1; --bad:#b3261e; --bad-soft:#fbe4e1; --neutral-soft:#e9edf4;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 10px 28px rgba(15,27,51,.07);
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1120; --surface:#111b31; --surface2:#16233e; --ink:#e8edf8; --muted:#98a5c1; --line:#25345a;
    --nav:#070d1a; --nav-ink:#9fb0d3; --nav-hi:#ffffff; --nav-active:#1d3677; --nav-line:#1a2742;
    --accent:#6f95ff; --accent-ink:#06112e; --accent-soft:#1a2b59; --accent-line:#2d4a8f;
    --warm:#f19a43; --warm-soft:#3a2915;
    --ok:#4cc98d; --ok-soft:#10382a; --warn:#f1b955; --warn-soft:#3b2d0f; --bad:#ff8a80; --bad-soft:#40181a; --neutral-soft:#1b2842;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1120; --surface:#111b31; --surface2:#16233e; --ink:#e8edf8; --muted:#98a5c1; --line:#25345a;
  --nav:#070d1a; --nav-ink:#9fb0d3; --nav-hi:#ffffff; --nav-active:#1d3677; --nav-line:#1a2742;
  --accent:#6f95ff; --accent-ink:#06112e; --accent-soft:#1a2b59; --accent-line:#2d4a8f;
  --warm:#f19a43; --warm-soft:#3a2915;
  --ok:#4cc98d; --ok-soft:#10382a; --warn:#f1b955; --warn-soft:#3b2d0f; --bad:#ff8a80; --bad-soft:#40181a; --neutral-soft:#1b2842;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;line-height:1.15} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{white-space:nowrap}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100dvh}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;padding:20px 14px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--warm);display:grid;place-items:center;color:#1a1004;font-weight:800;font-size:17px;flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand b{display:block;color:var(--nav-hi);font-size:16px;letter-spacing:.08em;line-height:1.1}
.brand span{font-size:12px;color:var(--nav-ink)}
.nav-g{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6f7fa3;padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--nav-ink);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav a:hover{background:rgba(255,255,255,.06);color:var(--nav-hi)}
.nav a[aria-current="page"]{background:var(--nav-active);color:var(--nav-hi)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--warm);color:#1a1004;border-radius:99px;padding:1px 7px;font-weight:800}
.side-foot{margin-top:auto;border-top:1px solid var(--nav-line);padding:14px 8px 4px;display:flex;align-items:center;gap:10px;font-size:12px}
.side-foot b{display:block;color:var(--nav-hi);font-size:13px}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:56px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.crumb{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface2)}
#burger{display:none}
.page{padding-block:26px 64px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1280px;margin-inline:auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h p{color:var(--muted);margin-top:4px;max-width:62ch}
.banner{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-size:13px;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);font-weight:600}
.banner[hidden]{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:15px;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:700}
.inp,select.inp,textarea.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;color:var(--ink)}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.inp[readonly]{background:var(--surface2)}
textarea.inp{resize:vertical;min-height:84px}
.hint{font-size:12px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row.r2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h p{color:var(--muted);font-size:13px;margin-top:2px}
.plain{background:none;border:0;box-shadow:none;padding:0}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--neutral-soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--accent-soft);color:var(--accent)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.card .tw{border:0;border-radius:0;margin-inline:-6px}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.filters{display:grid;gap:10px;grid-template-columns:minmax(200px,2fr) repeat(4,minmax(130px,1fr));margin-bottom:16px}

/* dashboard */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.todo{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;color:transparent}
.todo li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.todo li.done b{color:var(--muted);text-decoration:line-through}
.todo b{display:block;font-size:13.5px}
.todo span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.low i{background:var(--warm)}

/* editor */
.edit{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.sum{position:sticky;top:76px}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.sum dt{color:var(--muted);font-size:13px} .sum dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sum .tot{background:var(--accent-soft);margin:16px -22px;padding:16px 22px;display:flex;justify-content:space-between;align-items:baseline}
.sum .tot b{font-size:26px;font-family:var(--f-mono);letter-spacing:-.02em}
.line{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;background:var(--surface2)}
.line+.line{margin-top:12px}
.line-g{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}
.lc{grid-column:span 4}.ld{grid-column:span 8}.lq,.lp,.ldt,.li{grid-column:span 3}
.line-h{display:flex;justify-content:space-between;align-items:center}
.imp{font-family:var(--f-mono);font-weight:500;font-size:15px;text-align:right;padding-bottom:9px}

/* modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(7,13,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.4);width:100%;max-width:760px;margin:auto 0}
.modal.sm{max-width:520px}
.mh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.mh .grow{flex:1;min-width:0}
.mb{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.mf{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:14px 22px 20px;border-top:1px solid var(--line)}
.kv{display:grid;gap:12px 18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kv div span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv div b{font-weight:600;overflow-wrap:anywhere}
.totals{margin-left:auto;width:min(100%,320px);display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.totals .g{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.totals>*:nth-child(even){text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.paybox{border:1px dashed var(--accent-line);background:var(--accent-soft);border-radius:12px;padding:14px;display:grid;gap:12px}
.paybox[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:min(92vw,520px);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.toast[hidden]{display:none}
.cai-card{display:grid;gap:12px}
.cai-code{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere;color:var(--muted)}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.logo-prev{width:120px;height:70px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

@media (max-width:1100px){.two{grid-template-columns:1fr}.edit{grid-template-columns:1fr}.sum{position:static}.filters{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.line-g{grid-template-columns:repeat(2,minmax(0,1fr))}.lc,.ld{grid-column:1/-1}.lq,.lp,.ldt,.li{grid-column:span 1}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:30;transform:translateX(-102%);transition:transform .2s;padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(7,13,26,.5);z-index:20}
  #burger{display:grid}
  h1{font-size:22px}
  .card{padding:16px}
  .sum .tot{margin-inline:-16px;padding-inline:16px}
}
@media (max-width:520px){.filters{grid-template-columns:1fr}.mh,.mb,.mf{padding-inline:16px}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px;overflow-y:auto}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:16px}
.login-card .brand{padding:0}.login-card .brand b{color:var(--ink)}.login-card .brand span{color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Navegación"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top"><div class="top-in">
      <button class="icon-btn" id="burger" data-act="burger" aria-label="Abrir menú"></button>
      <div class="crumb" id="crumb"></div>
      <div class="top-r"><span class="chip" id="rolechip"></span><button class="icon-btn" data-act="theme" id="themebtn" aria-label="Cambiar tema"></button></div>
    </div></header>
    <div class="banner" id="banner" hidden></div>
    <main class="page" id="page"><div class="loading">Cargando datos…</div></main>
  </div>
</div>
<div class="overlay" id="modal" hidden></div>
<div class="overlay" id="confirm" hidden style="z-index:50;align-items:center"></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="login" id="login" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
(function(){
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(((+n||0)+Number.EPSILON)*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=(n,l)=>String(n).padStart(l,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDate=iso=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return `${+d} de ${MES[+m-1]} de ${y}`};
const fmtN=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
const addMonthDay=(iso,dia)=>{const [y,m]=iso.split('-').map(Number);const d=new Date(y,m,Math.min(dia||1,28),12);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0};
const TIPO={cotizacion:'Cotización',proforma:'Proforma',factura:'Factura'};
const PREF={cotizacion:'COT',proforma:'PRO'};
const COLS=['settings','clientes','productos','documentos','pagos','cai','recurrentes','contadores','bitacora'];

const IC={
 panel:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

const CONFIG=Object.assign({SUPABASE_URL:'',SUPABASE_ANON_KEY:''},window.INNOVANET_CONFIG||{});
let SB=null;
const SBC={cache:{},fns:{}};
async function loadCol(col){
  const out={};let from=0;
  for(;;){
    const {data,error}=await SB.from('docs').select('id,data').eq('col',col).order('id').range(from,from+999);
    if(error)throw new Error(error.message);
    data.forEach(r=>{out[r.id]=r.data});
    if(data.length<1000)break;from+=1000;
  }
  const same=JSON.stringify(SBC.cache[col]||null)===JSON.stringify(out);
  SBC.cache[col]=out;return !same;
}
function emitCol(col){const f=SBC.fns[col];if(f)f(Object.entries(SBC.cache[col]||{}).map(([id,v])=>Object.assign({id},v)))}
function startRealtime(){
  try{
    SB.channel('docs-sync').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.col)return;
      const c=SBC.cache[r.col]=SBC.cache[r.col]||{};
      if(p.eventType==='DELETE')delete c[r.id];else c[r.id]=p.new.data;
      emitCol(r.col);
    }).subscribe();
  }catch(e){}
  setInterval(()=>COLS.forEach(c=>loadCol(c).then(ch=>{if(ch)emitCol(c)}).catch(()=>{})),45000);
}
const Store={
  sb:null,
  subscribe(col,cb,onErr){
    if(this.sb){SBC.fns[col]=cb;SBC.cache[col]=SBC.cache[col]||{};loadCol(col).then(()=>emitCol(col)).catch(e=>onErr&&onErr(e));return ()=>{}}
    L.listeners[col]=cb;cb(arr(col));return ()=>{};
  },
  async put(col,id,data){
    if(this.sb){
      if(col==='contadores'){const {error}=await this.sb.rpc('set_counter',{p_key:id,p_next:+data.next});if(error)throw new Error(error.message);(SBC.cache[col]=SBC.cache[col]||{})[id]={next:+data.next};emitCol(col);return}
      const body=strip(data);const {error}=await this.sb.from('docs').upsert({col,id,data:body});
      if(error)throw new Error(error.message);
      (SBC.cache[col]=SBC.cache[col]||{})[id]=body;emitCol(col);return;
    }
    L.data[col][id]=strip(data);persistLocal();L.listeners[col]&&L.listeners[col](arr(col));
  },
  async del(col,id){
    if(this.sb){
      const {error}=await this.sb.from('docs').delete().eq('col',col).eq('id',id);if(error)throw new Error(error.message);
      if(SBC.cache[col])delete SBC.cache[col][id];emitCol(col);return;
    }
    delete L.data[col][id];persistLocal();L.listeners[col]&&L.listeners[col](arr(col));
  },
  /* siguiente número correlativo; el servidor lo asigna de forma atómica */
  async next(key,start,max){
    if(this.sb){
      const {data,error}=await this.sb.rpc('next_number',{p_key:key,p_start:start,p_max:max==null?null:max});
      if(error)throw new Error(error.message);
      if(data==null)return null;
      (SBC.cache.contadores=SBC.cache.contadores||{})[key]={next:+data+1};emitCol('contadores');
      return +data;
    }
    const c=L.data.contadores[key];const cur=c?(+c.next||start):start;
    if(max!=null&&cur>max)return null;
    await this.put('contadores',key,{next:cur+1});return cur;
  }
};

function calc(d){
  let sub=0,ld=0,grav=0,exen=0;
  d.lineas.forEach(l=>{const g=r2((+l.cant||0)*(+l.precio||0)),x=Math.min(r2(+l.dto||0),g),n=r2(g-x);sub+=g;ld+=x;if(l.exento)exen+=n;else grav+=n});
  sub=r2(sub);ld=r2(ld);const base=r2(grav+exen),desc=Math.min(r2(+d.descuento||0),base);
  let dg=0;if(base>0)dg=r2(desc*grav/base);const de=r2(desc-dg);
  const g=r2(grav-dg),e=r2(exen-de),isv=r2(g*(+d.impuestoPct||0)/100);
  return{subtotal:sub,descLineas:ld,descuento:desc,gravado:g,exento:e,impuesto:isv,total:r2(g+e+isv)};
}

function estadoDoc(d){
  if(d.estado==='anulada')return{k:'bad',l:'Anulada',key:'anulada'};
  if(d.estado==='convertida')return{k:'info',l:'Convertida',key:'convertida'};
  if(d.tipo==='factura'&&d.estado==='emitida'){
    const paid=paidOf(d.id),saldo=r2(d.total-paid);

    if(paid>0)return{k:'warn',l:'Pago parcial',key:'parcial'};
    return{k:'info',l:'Emitida',key:'emitida'};
  }

}

function words(n){
  const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const H=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const sub=n=>{if(n===100)return 'cien';const h=Math.floor(n/100),r=n%100,o=[];if(h)o.push(H[h]);if(r){if(r<30)o.push(U[r]);else{const t=Math.floor(r/10),u=r%10;o.push(u?T[t]+' y '+U[u]:T[t])}}return o.join(' ')};
  const apo=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const f=n=>{const mil=Math.floor(n/1000),r=n%1000,o=[];if(mil)o.push(mil===1?'mil':apo(sub(mil))+' mil');if(r)o.push(sub(r));return o.join(' ')};
  if(n===0)return 'cero';
  const mill=Math.floor(n/1e6),rest=n%1e6,o=[];
  if(mill)o.push(mill===1?'un millón':apo(f(mill))+' millones');
  if(rest)o.push(f(rest));
  return o.join(' ');
}
function enLetras(total,code){
  const e=Math.floor(total+1e-9),c=Math.round((total-e)*100),apo=t=>t.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const w=apo(words(e)),cw=c===0?'cero':apo(words(c));
  return w.charAt(0).toUpperCase()+w.slice(1)+' '+monOf(code).nombre.toLowerCase()+' con '+cw+(c===1?' centavo':' centavos');
}

function convPrice(p,fromCode,toCode){return r2(p*(monOf(fromCode).tasa||1)/(monOf(toCode).tasa||1))}
function draftField(f,t){
  const d=draft,v=t.type==='checkbox'?t.checked:t.value;

  if(!d.cliente.nombre.trim())return 'Escribe el nombre o razón social del cliente.';
  const ls=d.lineas.filter(l=>l.desc.trim());
  if(!ls.length)return 'Agrega al menos un artículo con descripción.';
  if(ls.some(l=>!(+l.cant>0)))return 'La cantidad de cada artículo debe ser mayor que 0.';
  if(d.tipo==='factura'&&d.condicion==='credito'&&!(+d.dias>0))return 'Indica los días de crédito, o cambia la condición de pago a Contado.';
  return '';
}

    lineas:d.lineas.map(l=>({prodId:l.prodId||'',desc:l.desc,cant:+l.cant,precio:+l.precio,dto:+l.dto||0,exento:!!l.exento})),descuento:t.descuento,descLineas:t.descLineas,impuestoPct:+d.impuestoPct||0,
    subtotal:t.subtotal,gravado:t.gravado,exento:t.exento,impuesto:t.impuesto,total:t.total,observaciones:d.observaciones||'',condicion:d.condicion||'contado',dias:+d.dias||0,
    estado:'borrador',origenId:d.origenId||'',recurrenteId:d.recurrenteId||'',creado:d.creado||new Date().toISOString(),actualizado:new Date().toISOString()};
  const prev=d.id?find('documentos',d.id):null;
  if(prev&&prev.estado!=='borrador'){
    if(!CAN.admin)throw new Error('Solo un administrador puede modificar un documento emitido.');
    ['estado','caiId','cai','emitida','anuladaMotivo','anuladaFecha','cambiosNumero','convertidoA'].forEach(k=>{if(prev[k]!==undefined)rec[k]=prev[k]});
    rec.numero=prev.numero;rec.creado=prev.creado||rec.creado;
    rec.ediciones=(prev.ediciones||[]).concat([{fecha:today(),antes:{total:prev.total,cliente:(prev.cliente||{}).nombre||'',fecha:prev.fecha}}]);
  }
  await Store.put('documentos',id,rec);
  if(d.origenId){const o=find('documentos',d.origenId);if(o&&o.estado==='borrador'){await Store.put('documentos',o.id,Object.assign({},o,{estado:'convertida',convertidoA:id}))}}
  return Object.assign({id},rec);
}
async function emitDoc(doc){
  if(doc.tipo!=='factura'||doc.estado!=='borrador')return false;
  if(!doc.cliente.nombre.trim()){toast('La factura necesita el nombre del cliente.',true);return false}
  const cai=pickCai(doc.fecha);
  if(!cai){toast('No hay un CAI vigente con números disponibles para la fecha '+fmtDate(doc.fecha)+'. Revisa Control CAI.',true);return false}
  return guard(async()=>{
    const n=await Store.next('cai-'+cai.id,+cai.desde,+cai.hasta);
    if(n==null)throw new Error('El rango de este CAI se agotó.');
    const numero=caiNum(cai,n);
    const rec=Object.assign({},doc,{estado:'emitida',numero,caiId:cai.id,cai:{codigo:cai.codigo,prefijo:cai.prefijo,desde:+cai.desde,hasta:+cai.hasta,limite:cai.limite||''},emitida:new Date().toISOString()});
    try{await Store.put('documentos',doc.id,rec)}catch(e){await sleep(600);await Store.put('documentos',doc.id,rec)}
    toast('Factura '+numero+' emitida');
    return true;
  });
}

/* ---- Historial ---- */
function histFiltered(){
  const h=UI.h,s=q();
  return sortDocs(S.documentos.filter(d=>{
    if(h.tipo&&d.tipo!==h.tipo)return false;
    if(h.estado&&estadoDoc(d).key!==h.estado)return false;
    if(h.desde&&d.fecha<h.desde)return false;if(h.hasta&&d.fecha>h.hasta)return false;
    if(s&&!(`${d.numero} ${d.cliente.nombre} ${d.cliente.rtn}`.toLowerCase().includes(s)))return false;
    return true;
  }));
}
VIEWS.historial=()=>{
  const h=UI.h,list=histFiltered();
  return head('Historial','Consulta, filtra, descarga o edita tus documentos.',`<button class="btn" data-act="export-csv">${ic('down')} Exportar CSV</button>`+roBtn(`<button class="btn pri" data-act="nav" data-p="nuevo">${ic('plus')} Crear documento</button>`))+
  `<div class="filters"><input class="inp" id="q-historial" data-q="1" placeholder="Número, cliente o RTN" value="${esc(UI.q.historial||'')}" aria-label="Buscar">
   <select class="inp" id="h-tipo" data-h="tipo" aria-label="Tipo">${opts([{v:'',l:'Todos los tipos'},{v:'cotizacion',l:'Cotización'},{v:'proforma',l:'Proforma'},{v:'factura',l:'Factura'}],h.tipo)}</select>
   <select class="inp" id="h-estado" data-h="estado" aria-label="Estado">${opts([{v:'',l:'Todos los estados'},{v:'borrador',l:'Borrador'},{v:'emitida',l:'Emitida'},{v:'parcial',l:'Pago parcial'},{v:'pagada',l:'Pagada'},{v:'vencida',l:'Vencida'},{v:'convertida',l:'Convertida'},{v:'anulada',l:'Anulada'}],h.estado)}</select>
   <input class="inp" type="date" id="h-desde" data-h="desde" value="${esc(h.desde)}" aria-label="Desde"><input class="inp" type="date" id="h-hasta" data-h="hasta" value="${esc(h.hasta)}" aria-label="Hasta"></div>`+
  (list.length?docTable(list):`<div class="card"><div class="empty"><h3>${S.documentos.length?'Ningún documento coincide':'Todavía no hay documentos'}</h3>${S.documentos.length?'Cambia los filtros para ver más resultados.':'Crea una cotización, una proforma o una factura y aparecerá aquí.'}</div></div>`);
};

  <div class="mb">

   <div class="tw"><table style="min-width:520px"><thead><tr><th>Descripción</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Desc.</th><th class="r">Importe</th></tr></thead><tbody>${d.lineas.map(l=>`<tr><td>${esc(l.desc)}${l.exento?' <span class="badge" style="margin-left:6px">Exento</span>':''}</td><td class="r num">${l.cant}</td><td class="r num">${fmtN(l.precio)}</td><td class="r num">${l.dto>0?'-'+fmtN(l.dto):'—'}</td><td class="r num">${fmtN(r2(l.cant*l.precio-(l.dto||0)))}</td></tr>`).join('')}</tbody></table></div>
   <div class="totals"><span>Subtotal</span><span>${fmtN(d.subtotal)}</span>${(d.descuento>0||d.descLineas>0)?`<span>Descuentos y rebajas</span><span>-${fmtN(r2((d.descuento||0)+(d.descLineas||0)))}</span>`:''}<span>Gravado</span><span>${fmtN(d.gravado)}</span><span>Exento</span><span>${fmtN(d.exento)}</span><span>ISV ${+d.impuestoPct}%</span><span>${fmtN(d.impuesto)}</span><span class="g">Total</span><span class="g">${money(d.total,d.moneda)}</span></div>
   <p class="muted" style="font-size:12.5px">Son: ${esc(enLetras(d.total,d.moneda))}</p>
   ${d.observaciones?`<div><div class="eyebrow">Observaciones</div><p style="margin-top:4px;white-space:pre-wrap">${esc(d.observaciones)}</p></div>`:''}
   ${(d.cambiosNumero||[]).length?`<div class="note"><b>Número modificado</b> por un administrador: ${d.cambiosNumero.map(c=>esc(c.de)+' → '+esc(c.a)+' ('+fmtDate(c.fecha)+', '+esc(c.motivo)+')').join('; ')}</div>`:''}
   ${d.estado==='anulada'?`<div class="note" style="color:var(--bad)"><b>Anulada</b> el ${fmtDate(d.anuladaFecha)}. Motivo: ${esc(d.anuladaMotivo||'—')}</div>`:''}

   ${fiscal&&d.estado==='emitida'?`<div><h3 style="margin-bottom:10px">Cobros · saldo <span class="num">${money(saldo,d.moneda)}</span></h3>
     ${pays.length?`<div class="tw"><table style="min-width:480px"><tbody>${pays.map(p=>`<tr><td class="num">${fmtDate(p.fecha)}</td><td>${esc(p.metodo)}${p.ref?`<span class="sub">${esc(p.ref)}</span>`:''}</td><td class="r num"><b>${money(p.monto,d.moneda)}</b></td>${CAN.admin?`<td class="r"><button class="btn sm bad" data-act="pay-del" data-id="${p.id}" aria-label="Eliminar cobro">${ic('trash')}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:`<p class="muted">Aún no hay cobros registrados.</p>`}
     ${CAN.write&&saldo>0.004?`<div class="paybox" id="payform"${prevPay?'':' hidden'}><div class="row"><div class="field"><label for="p-monto">Monto (${esc(monOf(d.moneda).simbolo)})</label><input class="inp" id="p-monto" type="number" step="any" min="0" value="${saldo}"></div><div class="field"><label for="p-fecha">Fecha</label><input class="inp" id="p-fecha" type="date" value="${today()}"></div><div class="field"><label for="p-met">Método</label><select class="inp" id="p-met">${opts(['Efectivo','Transferencia','Depósito','Cheque','Tarjeta'].map(x=>({v:x,l:x})),'Transferencia')}</select></div></div><div class="field"><label for="p-ref">Referencia (opcional)</label><input class="inp" id="p-ref" placeholder="No. de transferencia, cheque o recibo"></div><div class="acts"><button class="btn pri" data-act="pay-save" data-id="${d.id}">Guardar cobro</button></div></div>`:''}</div>`:''}
  </div>

   ${(CAN.write&&d.estado==='borrador')||CAN.admin?`<button class="btn bad" data-act="del-doc" data-id="${d.id}">${ic('trash')} Eliminar</button><button class="btn" data-act="edit-doc" data-id="${d.id}">${ic('edit')} Editar</button>`:''}
   ${CAN.write&&d.tipo==='cotizacion'&&d.estado==='borrador'?`<button class="btn" data-act="conv" data-id="${d.id}" data-to="proforma">A proforma</button>`:''}

/* ---- Cobros ---- */
VIEWS.cobros=()=>{
  const pend=sortDocs(S.documentos.filter(d=>d.tipo==='factura'&&d.estado==='emitida'&&saldoOf(d)>0.004)).reverse();
  const pays=S.pagos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,25);
  const tot=r2(pend.reduce((a,d)=>a+toHNL(saldoOf(d),d),0));
  return head('Cobros','Facturas con saldo pendiente y cobros registrados.')+
  `<div class="stack"><section class="card"><div class="card-h"><div><h2>Por cobrar</h2><p>Total pendiente: <b class="num">${moneyT(tot,'HNL')}</b> (convertido a lempiras).</p></div></div>
   ${pend.length?`<div class="tw"><table><thead><tr><th>Factura</th><th>Cliente</th><th>Vence</th><th class="r">Total</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${pend.map(d=>{const v=d.vence&&d.vence<today();return `<tr><td><b class="mono" style="font-size:13px">${esc(d.numero)}</b></td><td>${esc(d.cliente.nombre)}</td><td class="num">${d.vence?fmtDate(d.vence):'Contado'} ${v?'<span class="badge bad">Vencida</span>':''}</td><td class="r num">${money(d.total,d.moneda)}</td><td class="r num"><b>${money(saldoOf(d),d.moneda)}</b></td><td><div class="acts"><button class="btn sm" data-act="view-doc" data-id="${d.id}">${ic('eye')}</button>${CAN.write?`<button class="btn sm soft" data-act="pay-open" data-id="${d.id}">Cobrar</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><h3>No hay saldos pendientes</h3>Las facturas emitidas que no estén pagadas aparecerán aquí.</div>`}</section>
   <section class="card"><div class="card-h"><div><h2>Cobros recientes</h2><p>Últimos 25 pagos registrados.</p></div></div>
   ${pays.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Factura</th><th>Cliente</th><th>Método</th><th class="r">Monto</th></tr></thead><tbody>${pays.map(p=>{const d=find('documentos',p.docId)||{};return `<tr><td class="num">${fmtDate(p.fecha)}</td><td class="mono">${esc(d.numero||'—')}</td><td>${esc((d.cliente||{}).nombre||'—')}</td><td>${esc(p.metodo)}${p.ref?`<span class="sub">${esc(p.ref)}</span>`:''}</td><td class="r num"><b>${money(p.monto,d.moneda||'HNL')}</b></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><h3>Sin cobros registrados</h3>Registra un cobro desde la factura o con el botón Cobrar.</div>`}</section></div>`;
};

VIEWS.monedas=()=>head('Monedas','El lempira es la moneda base. Define la tasa de las demás para convertir los totales.',adBtn(`<button class="btn pri" data-act="mon-edit">${ic('plus')} Nueva moneda</button>`))+

VIEWS.cai=()=>head('Control CAI','Rangos autorizados por el SAR. El sistema numera las facturas en orden y no repite números.',adBtn(`<button class="btn pri" data-act="cai-edit">${ic('plus')} Registrar CAI</button>`))+
  (S.cai.length?`<div class="cards">${S.cai.slice().sort((a,b)=>(b.limite||'').localeCompare(a.limite||'')).map(c=>{const st=caiState(c),tot=+c.hasta-+c.desde+1,used=tot-st.left,nx=caiNext(c);return `<div class="card cai-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div class="eyebrow">Prefijo</div><h2 class="mono">${esc(c.prefijo)}</h2></div><span class="badge ${st.k}">${st.l}</span></div>
   <div class="cai-code">${esc(c.codigo)}</div>
   <div class="kv"><div><span>Desde</span><b class="mono">${pad(c.desde,8)}</b></div><div><span>Hasta</span><b class="mono">${pad(c.hasta,8)}</b></div><div><span>Siguiente</span><b class="mono">${nx<=+c.hasta?pad(nx,8):'—'}</b></div><div><span>Fecha límite</span><b>${fmtDate(c.limite)}</b></div></div>
   <div><div class="bar ${st.left<=50?'low':''}"><i style="width:${Math.min(100,Math.max(1,used/tot*100))}%"></i></div><div class="hint" style="margin-top:6px">${used.toLocaleString('en-US')} usados · ${st.left.toLocaleString('en-US')} disponibles</div></div>
   ${CAN.admin?`<div class="acts" style="justify-content:flex-start"><button class="btn sm" data-act="cai-toggle" data-id="${c.id}">${c.activo?'Desactivar':'Activar'}</button><button class="btn sm" data-act="cai-edit" data-id="${c.id}">${ic('edit')} Editar</button>${used===0?`<button class="btn sm bad" data-act="cai-del" data-id="${c.id}">${ic('trash')}</button>`:''}</div>`:''}</div>`}).join('')}</div>`:`<div class="card"><div class="empty"><h3>Aún no hay un CAI registrado</h3>Copia el código, el rango y la fecha límite desde la autorización del SAR.${CAN.admin?`<div style="margin-top:14px"><button class="btn pri" data-act="cai-edit">${ic('plus')} Registrar CAI</button></div>`:''}</div></div>`)+
  `<p class="note" style="margin-top:18px">El sistema avisa cuando quedan 50 números o menos, o faltan 30 días para el límite de emisión. Antes de usarlo en producción, confirma con tu contador que los datos impresos cumplen con lo que exige el SAR.</p>`;

async function genRec(r){
  const c=find('clientes',r.clienteId);if(!c)throw new Error('El cliente de este contrato ya no existe.');
  const per=r.proxima.split('-'),d=newDraft('factura');
  Object.assign(d,{moneda:r.moneda,tasa:monOf(r.moneda).tasa||1,fecha:r.proxima,clienteId:c.id,cliente:{nombre:c.nombre,rtn:c.rtn||'',direccion:c.direccion||'',telefono:c.telefono||'',correo:c.correo||''},
    lineas:[{prodId:'',desc:`${r.desc} - ${MESL[+per[1]-1]} ${per[0]}`,cant:1,precio:r.monto,exento:!!r.exento}],condicion:r.dias>0?'credito':'contado',dias:r.dias||0,recurrenteId:r.id});
  const prev=draft;draft=d;const res=await persistDraft();draft=prev;
  if(!res)throw new Error('No se pudo crear la factura.');
  await Store.put('recurrentes',r.id,Object.assign({},r,{ultima:r.proxima,proxima:addMonthDay(r.proxima,r.dia)}));
}
ACT['rec-gen']=d=>guard(async()=>{await genRec(find('recurrentes',d.id));toast('Factura en borrador creada. Emítela desde el historial.')});
ACT['rec-gen-all']=()=>guard(async()=>{
  let n=0;for(const r of S.recurrentes.filter(r=>r.activo&&r.proxima<=today())){let g=0;const cur=find('recurrentes',r.id);let x=cur;while(x.activo&&x.proxima<=today()&&g<12){await genRec(x);n++;g++;x=Object.assign({},x,{proxima:addMonthDay(x.proxima,x.dia)})}}
  toast(n+' factura'+(n===1?'':'s')+' en borrador creada'+(n===1?'':'s')+'. Emítelas desde el historial.');
});

ACT['edit-doc']=d=>{const x=find('documentos',d.id);if(!x||(x.estado!=='borrador'&&!CAN.admin))return;draft=Object.assign(clone(x),{guardarCliente:false,lineas:clone(x.lineas).map(l=>Object.assign({guardar:false},l))});closeModal();location.hash==='#nuevo'?renderPage():(location.hash='#nuevo')};
ACT.conv=d=>{const x=find('documentos',d.id);if(!x)return;draft=draftFrom(x,d.to);draft.tipo=d.to;closeModal();location.hash==='#nuevo'?renderPage():(location.hash='#nuevo');toast('Revisa los datos y guarda para crear la '+TIPO[d.to].toLowerCase())};
ACT['emit-row']=async d=>{const x=find('documentos',d.id);if(!x)return;await emitDoc(x);if(MODAL)viewDoc(d.id)};
ACT['del-doc']=d=>{const x=find('documentos',d.id);if(!x)return;const em=x.estado!=='borrador'&&x.tipo==='factura'&&x.estado!=='convertida';
  const msg=em?`Vas a eliminar la factura <b>${esc(x.numero)}</b> ya emitida. Su número quedará sin usar y puede romper el correlativo del CAI. Se borrarán también sus cobros y se guardará una copia en la bitácora. Esta acción no se puede deshacer.`:`Se eliminará <b>${esc(x.numero||'este borrador')}</b>. Esta acción no se puede deshacer.`;
  ask(em?'Eliminar factura emitida':'Eliminar documento',msg,'Eliminar',async()=>{
    if(await guard(async()=>{
      if(x.estado!=='borrador'){
        const ps=S.pagos.filter(p=>p.docId===x.id);
        await Store.put('bitacora','b-'+uid(),{accion:'eliminar',fecha:new Date().toISOString(),numero:x.numero||'',documento:x,pagos:ps});
        for(const p of ps)await Store.del('pagos',p.id);
      }
      await Store.del('documentos',d.id);
    },'Documento eliminado'))closeModal()},true)};
ACT['num-ask']=d=>{const x=find('documentos',d.id);$('#num-box').outerHTML=`<span id="num-box" style="margin-right:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="inp mono" id="num-n" value="${esc(x.numero)}" aria-label="Nuevo número" style="width:230px"><input class="inp" id="num-m" placeholder="Motivo del cambio" style="width:220px"><button class="btn pri" data-act="num-do" data-id="${x.id}">Guardar</button></span>`};
ACT['num-do']=async d=>{const x=find('documentos',d.id),n=val('num-n').trim(),m=val('num-m').trim();
  if(!n)return toast('Escribe el nuevo número.',true);if(n===x.numero)return toast('El número es el mismo.',true);if(!m)return toast('Escribe el motivo del cambio.',true);
  if(S.documentos.some(o=>o.id!==x.id&&o.numero===n))return toast('Ya existe un documento con ese número.',true);
  if(x.tipo==='factura'&&x.cai&&!n.startsWith(x.cai.prefijo+'-'))return toast('El número debe empezar con '+x.cai.prefijo+'- (el prefijo del CAI de esta factura).',true);
  const h=(x.cambiosNumero||[]).concat([{de:x.numero,a:n,motivo:m,fecha:today()}]);
  if(await guard(()=>Store.put('documentos',x.id,Object.assign({},x,{numero:n,cambiosNumero:h})),'Número actualizado'))viewDoc(d.id)};
ACT['anular-ask']=d=>{$('#anul-box').outerHTML=`<span id="anul-box" style="margin-right:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="inp" id="anul-m" placeholder="Motivo de la anulación" style="width:240px"><button class="btn bad" data-act="anular-do" data-id="${d.id}">Confirmar anulación</button></span>`;$('#anul-m').focus()};
ACT['anular-do']=async d=>{const m=val('anul-m');if(!m)return toast('Escribe el motivo de la anulación.',true);const x=find('documentos',d.id);
  if(await guard(()=>Store.put('documentos',x.id,Object.assign({},x,{estado:'anulada',anuladaMotivo:m,anuladaFecha:today()})),'Factura anulada'))viewDoc(d.id)};
ACT['pay-open']=d=>{viewDoc(d.id);setTimeout(()=>{const p=$('#payform');if(p){p.hidden=false;const i=$('#p-monto');i&&i.focus()}},30)};
ACT['pay-toggle']=()=>{const p=$('#payform');if(p){p.hidden=!p.hidden;if(!p.hidden)$('#p-monto').focus()}};
ACT['pay-save']=async d=>{const x=find('documentos',d.id),monto=r2(num(val('p-monto'))),saldo=saldoOf(x);
  if(!(monto>0))return toast('Indica un monto mayor que 0.',true);if(monto>saldo+0.005)return toast('El monto supera el saldo de '+moneyT(saldo,x.moneda)+'.',true);
  if(!val('p-fecha'))return toast('Indica la fecha del cobro.',true);
  if(await guard(()=>Store.put('pagos','pg-'+uid(),{docId:x.id,fecha:val('p-fecha'),monto,metodo:val('p-met'),ref:val('p-ref'),creado:new Date().toISOString()}),'Cobro registrado'))setTimeout(()=>viewDoc(d.id),50)};
ACT['pay-del']=d=>ask('Eliminar cobro','El saldo de la factura volverá a aumentar.','Eliminar',async()=>{await guard(()=>Store.del('pagos',d.id),'Cobro eliminado');if(MODAL)setTimeout(()=>viewDoc(MODAL.id),50)},true);
ACT.pdf=d=>pdfDoc(d.id);
ACT.logout=async()=>{try{await SB.auth.signOut()}catch(e){}location.reload()};

/* ============ CSV, respaldo ============ */
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch}
    else if(ch==='"')inQ=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=ch}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);
  if(!rows.length)return[];
  const norm=s=>s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const h=rows[0].map(norm);return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||'').trim());return o});
}
async function importCsv(kind,file){
  const rows=parseCSV(await file.text());let n=0;
  await guard(async()=>{
    for(const r of rows){
      if(kind==='cli'){const nombre=r.nombre||r['razon social']||r.cliente;if(!nombre)continue;await Store.put('clientes','c-'+uid(),{nombre,rtn:r.rtn||'',direccion:r.direccion||'',telefono:r.telefono||'',correo:r.correo||r.email||'',creado:new Date().toISOString()});n++}
      else{const nombre=r.nombre||r.descripcion;if(!nombre)continue;await Store.put('productos','p-'+uid(),{nombre,precio:num(r.precio),moneda:(r.moneda||'HNL').toUpperCase(),tipo:/serv/i.test(r.tipo||'')?'servicio':'producto',exento:/^(si|sí|1|true|x|exento)$/i.test((r.exento||'').trim())});n++}
    }
    toast(n+(kind==='cli'?' cliente':' producto')+(n===1?'':'s')+' importado'+(n===1?'':'s'));
  });
}
const csvCell=v=>{v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
ACT['export-csv']=()=>{
  const rows=[['numero','tipo','estado','fecha','cliente','rtn','moneda','subtotal','descuento','gravado','exento','isv','total','saldo']];
  histFiltered().forEach(d=>rows.push([d.numero,TIPO[d.tipo],estadoDoc(d).l,d.fecha,d.cliente.nombre,d.cliente.rtn,d.moneda,d.subtotal,d.descuento,d.gravado,d.exento,d.impuesto,d.total,d.tipo==='factura'&&d.estado==='emitida'?saldoOf(d):'']));
  download('documentos-'+today()+'.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');
};
ACT.backup=()=>{
  const data={};COLS.forEach(c=>{data[c]={};S[c].forEach(x=>{data[c][x.id]=strip(x)})});
  download('innovanet-respaldo-'+today()+'.json',JSON.stringify({app:'innovanet-facturacion',version:1,fecha:new Date().toISOString(),data},null,1),'application/json');
};
async function restore(file){
  let p;try{p=JSON.parse(await file.text())}catch(e){return toast('El archivo no es un respaldo válido.',true)}
  if(!p||p.app!=='innovanet-facturacion'||!p.data)return toast('El archivo no es un respaldo de este sistema.',true);
  let n=0;COLS.forEach(c=>n+=Object.keys(p.data[c]||{}).length);
  ask('Restaurar respaldo',`Se cargarán <b>${n}</b> registros del respaldo. Los registros con el mismo identificador se reemplazan; los demás se conservan.`,'Restaurar',()=>guard(async()=>{
    for(const c of COLS)for(const [id,v] of Object.entries(p.data[c]||{}))await Store.put(c,id,v);
  },'Respaldo restaurado'));
}
function loadLogo(file){
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,360/img.width,180/img.height),w=Math.round(img.width*sc),h=Math.round(img.height*sc),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    guard(()=>Store.put('settings','empresa',Object.assign({},EMP,{logo:cv.toDataURL('image/png'),logoW:w,logoH:h})),'Logo actualizado')};img.onerror=()=>toast('No se pudo leer la imagen.',true);img.src=rd.result};rd.readAsDataURL(file);
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'&&!$('#modal').hidden){closeModal();return}
  const t=e.target.closest('[data-act]');if(!t)return;const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset,t)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#confirm').hidden)$('#confirm').hidden=true;else if(!$('#modal').hidden)closeModal()}});
function onField(e,isChange){
  const t=e.target,viaChange=t.tagName==='SELECT'||t.type==='checkbox';
  if(viaChange!==isChange)return;
  if(t.dataset.q){UI.q[CUR]=t.value;renderPage();return}
  if(t.dataset.h){UI.h[t.dataset.h]=t.value;renderPage();return}
  if(!draft||CUR!=='nuevo')return;
  if(t.dataset.f)draftField(t.dataset.f,t);
  else if(t.dataset.c)draft.cliente[t.dataset.c]=t.value;
  else if(t.dataset.l!==undefined)draftLine(+t.dataset.l,t.dataset.k,t);
}
document.addEventListener('input',e=>onField(e,false));
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.perfil&&SB){
    SB.from('perfiles').update({rol:t.value}).eq('user_id',t.dataset.perfil).then(({error})=>{if(error)toast('No se pudo cambiar el rol: '+error.message,true);else toast('Rol actualizado');loadPerfiles().then(()=>{if(CUR==='accesos')renderPage()})});return;
  }
  if(t.dataset.file&&t.files&&t.files[0]){const f0=t.files[0],k=t.dataset.file;t.value='';
    if(k==='csv-cli')importCsv('cli',f0);else if(k==='csv-prod')importCsv('prod',f0);else if(k==='restore')restore(f0);else if(k==='logo')loadLogo(f0);return}
  onField(e,true);
});

/* ============ arranque ============ */
function route(){
  const h=location.hash.slice(1);CUR=PAGES[h]?h:'panel';
  if(CUR==='nuevo'&&!draft)draft=null;
  renderPage();window.scrollTo(0,0);
  if(CUR==='accesos'&&SB&&CAN.admin)loadPerfiles().then(()=>{if(CUR==='accesos')renderPage()});
}
window.addEventListener('hashchange',route);
function applySettings(){
  const m={};S.settings.forEach(x=>m[x.id]=x);
  EMP=Object.assign({},DEF_EMP,m.empresa||{});delete EMP.id;
  MON=(m.monedas&&m.monedas.list&&m.monedas.list.length)?m.monedas.list:DEF_MON.slice();
  if(!MON.some(x=>x.code==='HNL'))MON.unshift(DEF_MON[0]);
}
function banner(msg){const b=$('#banner');b.textContent=msg;b.hidden=!msg}
function startSync(){
  const loaded=new Set();
  const timer=setTimeout(()=>{if(!READY){READY=true;banner('No se pudo contactar el servidor. Lo que ves puede estar desactualizado.');route()}},10000);
  COLS.forEach(col=>Store.subscribe(col,list=>{
    S[col]=list;if(col==='settings')applySettings();loaded.add(col);
    if(!READY&&loaded.size===COLS.length){READY=true;clearTimeout(timer)}
    if(READY){clearTimeout(refresh.t);refresh.t=setTimeout(refresh,60)}
  },err=>{banner('No se pudieron leer los datos ('+(err&&err.message?err.message:'error')+'). Revisa tu sesión o recarga la página.')}));
}
function loginView(msg){
  const l=$('#login');l.hidden=false;
  l.innerHTML=`<form class="login-card" id="loginform"><div class="brand"><div class="brand-mark">I</div><div><b>INNOVANET</b><span>Gestión comercial</span></div></div><h1>Iniciar sesión</h1>
   <div class="field"><label for="lg-email">Correo</label><input class="inp" id="lg-email" type="email" autocomplete="username" required></div>
   <div class="field"><label for="lg-pass">Contraseña</label><input class="inp" id="lg-pass" type="password" autocomplete="current-password" required></div>
   <div class="err" id="lg-err" role="alert">${esc(msg||'')}</div><button class="btn pri lg" id="lg-btn" type="submit">Entrar</button></form>`;
  const e=$('#lg-email');e&&e.focus();
}
function noAccess(email){
  const l=$('#login');l.hidden=false;
  l.innerHTML=`<div class="login-card"><h1>Sin acceso</h1><p class="muted">La cuenta <b>${esc(email)}</b> todavía no tiene permisos. Pide al administrador que la active.</p><button class="btn lg" data-act="logout">Salir</button></div>`;
}
async function startSb(session){
  const {data,error}=await SB.from('perfiles').select('rol,nombre,email').eq('user_id',session.user.id).maybeSingle();
  if(error||!data||data.rol==='inactivo'){noAccess(session.user.email);return}
  ME={email:session.user.email,nombre:data.nombre||session.user.email,rol:data.rol,id:session.user.id};
  CAN.admin=data.rol==='admin';CAN.write=CAN.admin||data.rol==='facturador';CAN.owner=CAN.admin;
  $('#login').hidden=true;$('#login').innerHTML='';
  $('#rolechip').textContent=roleLabel();
  Store.sb=SB;startSync();startRealtime();route();
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginform')return;e.preventDefault();
  const b=$('#lg-btn');b.disabled=true;b.textContent='Entrando…';
  const {data,error}=await SB.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-pass').value});
  if(error){loginView('Correo o contraseña incorrectos.');return}
  await startSb(data.session);
});
async function boot(){
  try{const th=localStorage.getItem('innovanet-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
  $('#burger').innerHTML=ic('menu');themeIcon();renderSide();
  if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY){
    if(!window.supabase){loginView('No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.');return}
    SB=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
    SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ME)location.reload()});
    const {data}=await SB.auth.getSession();
    if(!data.session){loginView();return}
    await startSb(data.session);
    return;
  }
  $('#rolechip').textContent=roleLabel();
  banner('Modo de prueba: no hay servidor configurado, los datos solo se guardan en este navegador.');
  startSync();route();
}
boot();
})();
